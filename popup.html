<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WhatsApp Counter</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    width: 300px;
    padding: 14px;
    color: #222;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
    color: #075e54;
  }
  .count-wrap {
    text-align: center;
    margin-bottom: 10px;
  }
  .count {
    font-size: 40px;
    font-weight: 700;
    color: #128c7e;
  }
  .of-limit {
    font-size: 13px;
    color: #666;
  }
  .bar-bg {
    height: 10px;
    background: #e6e6e6;
    border-radius: 6px;
    overflow: hidden;
    margin: 8px 0 14px;
  }
  .bar-fill {
    height: 100%;
    background: #25d366;
    width: 0%;
    transition: width 0.3s;
  }
  .bar-fill.over {
    background: #e53935;
  }
  .limit-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .limit-row input {
    width: 60px;
    padding: 3px 6px;
  }
  button {
    background: #128c7e;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #0e6b60;
  }
  h2 {
    font-size: 13px;
    margin: 14px 0 6px;
    color: #444;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  ul#history {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 12px;
  }
  ul#history li,
  ol#recipientList li {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  ol#recipientList {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 12px;
    max-height: 160px;
    overflow-y: auto;
  }
  ol#recipientList li .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 190px;
  }
  select#statsPeriod {
    font-size: 12px;
    padding: 2px 4px;
  }
  .empty {
    font-size: 12px;
    color: #999;
    padding: 6px 0;
  }
  .reset {
    margin-top: 10px;
    font-size: 11px;
    color: #999;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>Messages sent today</h1>
  <div class="count-wrap">
    <div class="count" id="count">0</div>
    <div class="of-limit"><span id="limitLabel">/ 100</span></div>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>

  <div class="limit-row">
    <label for="limit">Daily limit:</label>
    <input type="number" id="limit" min="1" value="100" />
    <button id="save">Save</button>
  </div>

  <h2>Last 7 days</h2>
  <ul id="history"></ul>

  <h2>
    Top recipients
    <select id="statsPeriod">
      <option value="today">Today</option>
      <option value="month">This month</option>
      <option value="year">This year</option>
      <option value="all">All time</option>
    </select>
  </h2>
  <ol id="recipientList"></ol>
  <div class="reset" id="resetContacts">Reset contacts</div>

  <div class="reset" id="resetToday">Reset today's count</div>

  <script src="popup.js"></script>
</body>
</html>
